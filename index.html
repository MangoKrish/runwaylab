<!-- This page may only talk to its own site. That is what makes "only the stills leave" true by enforcement
     rather than by promise. wasm-unsafe-eval lets the pose trackers run, and blob: is for local video. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#F3EEE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14213D" media="(prefers-color-scheme: dark)">
